version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    target-branch: dev
    open-pull-requests-limit: 5
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    target-branch: dev
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    target-branch: dev
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
    target-branch: dev
