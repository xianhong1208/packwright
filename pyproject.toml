[project]
name = "packwright"
version = "1.2.0"
description = "Packwright - Full-stack build & packaging platform"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "websockets>=17.4",
    "sqlalchemy[asyncio]>=2.1.6",
    "aiosqlite>=0.20.0",
    "asyncpg>=0.29.0",
    "psycopg2-binary>=2.9.9",
    "pydantic>=2.14.2",
    "pydantic-settings>=2.1.0",
    "python-multipart>=0.0.31",
    "pyjwt>=2.15.0",
    "nuitka>=4.1.2",
    "bcrypt>=4.0.0",
    "cryptography>=42.0.0",
    "httpx>=0.27.0",
    "alembic>=1.13.0",
    "psutil>=5.9.0",
    "gputil>=1.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=1.4.1.post1",
    "pytest-mock>=3.17.0",
    "ruff>=0.15.0",
]

[tool.ruff]
line-length = 120
extend-exclude = ["alembic/versions", "frontend"]

[tool.ruff.lint]
# Correctness only (pyflakes + the E4/E7/E9 errors), the same baseline as the
# sibling projects. Style rules can be added one at a time with their fixes.
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
# Models import each other at the bottom so the relationship strings resolve
# without a circular import at load time.
"app/models/*" = ["E402"]
# Imported for their side effect: registering every table on Base.metadata.
"alembic/env.py" = ["F401"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "strict"
markers = [
    "unit: fast, isolated tests with no DB / network / subprocess",
    "integration: tests that touch external systems",
]
